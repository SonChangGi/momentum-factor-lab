name: Publish previous Factor address
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: previous-factor-address
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: |
          mkdir _site
          cp index.html 404.html relocation.json _site/
          cp -R data assets _site/
          test ! -e _site/factor_lab
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: publish
      - name: Verify guide and immutable data bytes
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            matched=true
            while IFS= read -r -d '' local; do
              relative="${local#_site/}"
              if ! curl --fail --silent --show-error --location --max-time 60 \
                "${PAGE_URL%/}/${relative}?verify=${GITHUB_RUN_ID}-${attempt}" \
                -o "$RUNNER_TEMP/readback" || ! cmp --silent "$local" "$RUNNER_TEMP/readback"; then
                matched=false; break
              fi
            done < <(find _site -type f -print0)
            [[ "$matched" != true ]] || exit 0
            sleep 5
          done
          exit 1
