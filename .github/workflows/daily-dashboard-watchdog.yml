name: Daily Momentum Dashboard Watchdog

on:
  workflow_dispatch:
    # Manual dispatch remains available when a reviewed refresh is needed.
  schedule:
    # 08:30/10:30/12:30 KST Tue-Sat: 1-2 hour freshness-gated fallback checks.
    - cron: "30 23 * * 1-5"
    - cron: "30 1 * * 2-6"
    - cron: "30 3 * * 2-6"

concurrency:
  group: daily-momentum-dashboard-watchdog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch-if-stale:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh checkout to latest branch head
        run: |
          git fetch origin "${DEFAULT_BRANCH:-main}" --depth=1
          git reset --hard "origin/${DEFAULT_BRANCH:-main}"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Decide whether dashboard is stale
        id: freshness
        env:
          DASHBOARD_FRESHNESS_EVENT_NAME: schedule
        run: |
          python -m momentum_factor_lab.dashboard_freshness \
            --event-name "${DASHBOARD_FRESHNESS_EVENT_NAME}" \
            --data-path docs/data/dashboard.json \
            --status-path docs/data/automation-status.json >> "$GITHUB_OUTPUT"

      - name: Dispatch daily dashboard workflow
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "Dashboard is stale: ${{ steps.freshness.outputs.reason }}"
          echo "Latest run KST: ${{ steps.freshness.outputs.latest_run_kst }}"
          echo "Cutoff KST: ${{ steps.freshness.outputs.cutoff_kst }}"
          gh workflow run daily-dashboard.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH:-main}" \
            -f watchdog_origin=true

      - name: Report dashboard already fresh
        if: steps.freshness.outputs.skip == 'true'
        run: |
          echo "${{ steps.freshness.outputs.reason }}"
          echo "Latest run KST: ${{ steps.freshness.outputs.latest_run_kst }}"
          echo "Cutoff KST: ${{ steps.freshness.outputs.cutoff_kst }}"

  public-site-health:
    needs: dispatch-if-stale
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Fail only when the existing Momentum page is unusable
        env:
          PAGE_URL: https://sonchanggi.github.io/momentum-factor-lab/
        shell: bash
        run: |
          set -u
          required_paths=(index.html data/summary.json data/dashboard.json)
          for attempt in {1..12}; do
            usable=true
            for relative_path in "${required_paths[@]}"; do
              readback="$RUNNER_TEMP/momentum-watchdog-health-${relative_path//\//-}"
              if ! curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --connect-timeout 10 \
                --max-time 120 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"; then
                usable=false
                break
              fi
              if [[ ! -s "$readback" ]]; then
                usable=false
                break
              fi
              if [[ "$relative_path" == "index.html" ]] && ! grep -Eiq '<!doctype html|<html' "$readback"; then
                usable=false
                break
              fi
              if [[ "$relative_path" == *.json ]] && ! jq -e 'type == "object" and length > 0' "$readback" >/dev/null; then
                usable=false
                break
              fi
            done
            if [[ "$usable" == "true" ]]; then
              echo "The existing Momentum page remains usable; watchdog errors stay in run logs without failure mail."
              exit 0
            fi
            [[ $attempt -lt 12 ]] && sleep 10
          done
          echo "::error::The public Momentum page or its required JSON is unavailable or invalid."
          exit 1
