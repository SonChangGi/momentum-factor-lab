name: Daily Momentum Dashboard

on:
  workflow_dispatch:
    inputs:
      watchdog_origin:
        description: Treat this queued watchdog rerun as a freshness-gated schedule
        required: true
        default: false
        type: boolean
  schedule:
    # 06:30 KST Tue-Sat: first refresh after the prior U.S. regular session close settles.
    - cron: "30 21 * * 1-5"

concurrency:
  group: daily-momentum-dashboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' || inputs.watchdog_origin == true }}
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      pages_source_sha: ${{ steps.pages-request.outputs.source_sha }}
      should_deploy_pages: ${{ steps.pages-request.outputs.should_deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Refresh checkout to latest branch head
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --depth=1
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Decide whether dashboard refresh should run
        id: freshness
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WATCHDOG_ORIGIN: ${{ inputs.watchdog_origin || false }}
        run: |
          effective_event_name="${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] \
            && [ "${WATCHDOG_ORIGIN}" = "true" ]; then
            effective_event_name="schedule"
          fi
          python -m momentum_factor_lab.dashboard_freshness \
            --event-name "${effective_event_name}" \
            --data-path docs/data/dashboard.json \
            --status-path docs/data/automation-status.json >> "$GITHUB_OUTPUT"

      - name: Report skipped dashboard refresh
        if: steps.freshness.outputs.skip == 'true'
        run: |
          echo "${{ steps.freshness.outputs.reason }}"
          echo "Latest run KST: ${{ steps.freshness.outputs.latest_run_kst }}"
          echo "Cutoff KST: ${{ steps.freshness.outputs.cutoff_kst }}"

      - name: Set up Python
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Momentum Factor Lab with live-data extras
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[live]'

      - name: Build daily Korean dashboard
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m momentum_factor_lab.cli scheduled-dashboard \
            --config .github/momentum-dashboard-config.json \
            --site-dir docs

      - name: Reject secrets in generated publication
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m momentum_factor_lab.publication_security docs

      - name: Commit dashboard updates
        if: steps.freshness.outputs.skip != 'true'
        env:
          FRESHNESS_EVENT_NAME: ${{ steps.freshness.outputs.event_name }}
        run: |
          validate_candidate_against_remote() {
            git fetch origin "${GITHUB_REF_NAME}" --depth=1
            remote_dashboard="${RUNNER_TEMP}/remote-dashboard.json"
            remote_automation_status="${RUNNER_TEMP}/remote-automation-status.json"
            if git show "origin/${GITHUB_REF_NAME}:docs/data/dashboard.json" > "${remote_dashboard}" 2>/dev/null; then
              if ! git show "origin/${GITHUB_REF_NAME}:docs/data/automation-status.json" > "${remote_automation_status}" 2>/dev/null; then
                printf '{}\n' > "${remote_automation_status}"
              fi
              if [ "${FRESHNESS_EVENT_NAME}" = "schedule" ]; then
                precommit_freshness="${RUNNER_TEMP}/precommit-freshness.out"
                python -m momentum_factor_lab.dashboard_freshness \
                  --event-name "${FRESHNESS_EVENT_NAME}" \
                  --data-path "${remote_dashboard}" \
                  --status-path "${remote_automation_status}" > "${precommit_freshness}" || true
                cat "${precommit_freshness}"
                if grep -q '^skip=true$' "${precommit_freshness}"; then
                  echo "Remote branch already has a dashboard execution after 06:30 KST; skipping duplicate commit."
                  exit 0
                fi
              fi
              python -m momentum_factor_lab.dashboard_monotonic \
                --baseline "${remote_dashboard}" \
                --candidate docs/data/dashboard.json
            fi
          }
          validate_candidate_against_remote
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          validate_candidate_against_remote
          if git diff --quiet -- docs; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          commit_message="${RUNNER_TEMP}/dashboard-commit-message.txt"
          cat > "${commit_message}" <<'EOF'
          Keep the published dashboard current after the scheduled data run

          Constraint: Scheduled and manual GitHub Actions updates only generated docs assets after freshness and monotonic publication gates.
          Confidence: high
          Scope-risk: narrow
          Directive: Do not use this automated commit for source-code or policy changes; those require reviewed human/agent commits.
          Tested: momentum_factor_lab.cli scheduled-dashboard completed in this workflow.
          Not-tested: External free data providers may publish the latest close with delay.
          EOF
          perl -pi -e 's/^          //' "${commit_message}"
          git commit -F "${commit_message}"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the latest remote branch before retry."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            validate_candidate_against_remote
            sleep $((attempt * 10))
          done
          echo "Failed to push dashboard updates after retries." >&2
          exit 1

      - name: Record the current production head for Pages
        id: pages-request
        if: steps.freshness.outputs.skip != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "A non-production branch was updated; Pages deployment remains disabled."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          timeout 60s git fetch origin "${DEFAULT_BRANCH}" --depth=1
          source_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the current production SHA." >&2
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  request-pages-deployment:
    needs: update-dashboard
    if: needs.update-dashboard.outputs.should_deploy_pages == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' || inputs.watchdog_origin == true }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch workflow-owned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ needs.update-dashboard.outputs.pages_source_sha }}
        run: |
          set -euo pipefail
          timeout 30s gh workflow run deploy-pages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH}" \
            -f expected_source_sha="${EXPECTED_SOURCE_SHA}" \
            -f request_origin=daily-dashboard

  public-site-health:
    needs: [update-dashboard, request-pages-deployment]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.watchdog_origin == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Fail only when the existing Momentum page is unusable
        env:
          PAGE_URL: https://sonchanggi.github.io/momentum-factor-lab/
        shell: bash
        run: |
          set -u
          required_paths=(index.html data/summary.json data/dashboard.json)
          for attempt in {1..12}; do
            usable=true
            for relative_path in "${required_paths[@]}"; do
              readback="$RUNNER_TEMP/momentum-health-${relative_path//\//-}"
              if ! curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --connect-timeout 10 \
                --max-time 120 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"; then
                usable=false
                break
              fi
              if [[ ! -s "$readback" ]]; then
                usable=false
                break
              fi
              if [[ "$relative_path" == "index.html" ]] && ! grep -Eiq '<!doctype html|<html' "$readback"; then
                usable=false
                break
              fi
              if [[ "$relative_path" == *.json ]] && ! jq -e 'type == "object" and length > 0' "$readback" >/dev/null; then
                usable=false
                break
              fi
            done
            if [[ "$usable" == "true" ]]; then
              echo "The existing Momentum page remains usable; scheduled refresh errors stay in run logs without failure mail."
              exit 0
            fi
            [[ $attempt -lt 12 ]] && sleep 10
          done
          echo "::error::The public Momentum page or its required JSON is unavailable or invalid."
          exit 1
